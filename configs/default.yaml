# ─── LLM ──────────────────────────────────────────────────────────────────────
llm:
  provider: "groq"                          # "groq" | "openai" | "local"
  # Groq models (fast, free tier available)
  pipeline_model: "llama-3.3-70b-versatile" # LLM-A: decompose + repair + LLM-judge verify
  eval_model: "gemma2-9b-it"               # LLM-B: independent evaluator (different family)
  temperature: 0
  max_tokens: 1024
  seed: 42
  # Set GROQ_API_KEY in .env or environment

# ─── Retriever ────────────────────────────────────────────────────────────────
retriever:
  dense_encoder: "BAAI/bge-small-en-v1.5"               # ~33M params, fits Colab T4
  cross_encoder: "cross-encoder/ms-marco-MiniLM-L-6-v2" # optional reranker (Phase 5)
  default_method: "bm25"                                 # Phase 3: bm25; Phase 5: hybrid
  top_k: 5
  rerank_top_n: 50                                       # candidates before cross-encoder

# ─── NLI Verifier ────────────────────────────────────────────────────────────
nli:
  model: "cross-encoder/nli-deberta-v3-small"  # upgrade to large for final runs
  threshold_supported: 0.7                     # τ_s — tune on dev in Phase 6
  threshold_contradicted: 0.5                  # τ_c — tune on dev in Phase 6

# ─── Data ────────────────────────────────────────────────────────────────────
data:
  processed_dir: "data/processed"
  gold_dir: "data/gold"
  splits_file: "data/splits.json"
  seed: 42

# ─── Corpus ──────────────────────────────────────────────────────────────────
corpus:
  tier: "A"              # "A" = FEVER wiki-pages; "B" = scoped Wikipedia
  chunk_size: 150        # words per passage
  chunk_overlap: 20
  max_passages: 1500000  # Colab 12GB RAM budget (~1-2M at 768-dim fp16)

# ─── Pipeline ────────────────────────────────────────────────────────────────
pipeline:
  repair_policy: "rewrite+hedge"   # "rewrite+hedge" | "rewrite+remove" | "rewrite-only"
  max_repair_iterations: 2
  min_claim_length: 5              # skip very short claims

# ─── Cache ───────────────────────────────────────────────────────────────────
cache:
  backend: "sqlite"
  # Local path (override in Colab to Drive path via env LLM_CACHE_PATH)
  path: "llm_cache.db"

# ─── Logging ─────────────────────────────────────────────────────────────────
logging:
  use_wandb: false
  project: "hallucination-repair"
  run_dir: "results/"
