name: Python checks

on:
  push:
    branches:
      - main
      - codex/**
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'pytest>=8,<10' 'numpy>=1.26,<3' 'scipy>=1.13,<2' 'PyYAML>=6,<7' 'rank-bm25>=0.2,<1' 'nbformat>=5,<6'
      - name: Compile Python sources
        run: python -m compileall -q scripts src demo
      - name: Validate Colab notebook
        run: |
          python - <<'PY'
          import ast
          import nbformat
          from pathlib import Path

          notebook = nbformat.read(Path('notebooks/04_train_A_C_colab.ipynb'), as_version=4)
          nbformat.validate(notebook)
          for cell in notebook.cells:
              if cell.cell_type == 'code':
                  ast.parse(cell.source)
          PY
      - name: Run CPU tests
        run: python -m pytest tests -q
